name: Pages

# Web 版を GitHub Pages に公開する。configure-pages の enablement で
# Pages 自体の有効化も試みる（リポジトリが公開されている必要がある）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # web/index.html はアーティファクト用の断片（doctype と head を持たない）
      # なので、単体で開ける完全な文書に包んでから公開する。
      - name: 完全な HTML に組み立てる
        run: |
          mkdir -p _site
          {
            echo '<!doctype html>'
            echo '<html lang="ja">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '<meta name="theme-color" content="#141618">'
            echo '<meta name="apple-mobile-web-app-capable" content="yes">'
            echo '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
            echo '<title>Clock</title>'
            echo '<link rel="manifest" href="manifest.webmanifest">'
            echo '<link rel="icon" href="icon-192.png">'
            echo '<link rel="apple-touch-icon" href="apple-touch-icon.png">'
            echo '</head>'
            echo '<body>'
            cat web/index.html
            echo '</body>'
            echo '</html>'
          } > _site/index.html
          cp web/manifest.webmanifest web/icon-192.png web/icon-512.png web/apple-touch-icon.png _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
